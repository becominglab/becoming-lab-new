name: Daily Real Estate Screening

on:
  schedule:
    # 毎朝 7:00 JST (22:00 UTC 前日)
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  daily-screening:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: real-estate-screener/package-lock.json

      - name: Install dependencies
        working-directory: real-estate-screener
        run: npm ci

      - name: Install Playwright browsers
        working-directory: real-estate-screener
        run: npx playwright install chromium --with-deps

      - name: Generate Prisma client
        working-directory: real-estate-screener
        run: npx prisma generate

      - name: Initialize database
        working-directory: real-estate-screener
        run: |
          mkdir -p data/logs data/raw data/normalized data/reports
          npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: 'file:./data/screener.db'

      - name: Run daily screening
        working-directory: real-estate-screener
        run: npm run daily
        env:
          DATABASE_URL: 'file:./data/screener.db'
          USE_PLAYWRIGHT: 'true'
          NODE_ENV: production

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-reports-${{ github.run_number }}
          path: real-estate-screener/data/reports/
          retention-days: 90

      - name: Commit reports to repo
        working-directory: real-estate-screener
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reports/ || true
          git diff --staged --quiet || git commit -m "chore: daily screening report $(date +%Y-%m-%d)"
          git push || true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: real-estate-screener/package-lock.json
      - name: Install & test
        working-directory: real-estate-screener
        run: |
          npm ci
          npx prisma generate
          npm test
